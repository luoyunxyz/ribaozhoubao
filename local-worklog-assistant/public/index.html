<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地工作记录助手</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">本地工作记录助手</div>
      <button data-view="dashboard" class="nav active">首页</button>
      <button data-view="timeline" class="nav">时间线</button>
      <button data-view="reports" class="nav">报告</button>
      <button data-view="heatmap" class="nav">热力图</button>
      <button data-view="usage" class="nav">应用统计</button>
      <button data-view="settings" class="nav">设置</button>
    </aside>
    <main class="app">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">首页</h1>
          <p id="pageSub">自动记录电脑活动，生成可复盘的工作记录。</p>
        </div>
        <div class="date-filter">
          <input id="startDate" type="date" />
          <input id="endDate" type="date" />
          <button id="reloadBtn">刷新</button>
        </div>
      </header>
      <section id="content"></section>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
